<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم — مهدي فود</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body dir="rtl">

<!-- قفل الدخول -->
<div class="lock" id="lock">
  <form class="lock-card" id="lockForm">
    <div class="mark">🐟</div>
    <h1>لوحة التحكم</h1>
    <p>مهدي فود — إدارة المنيو والأسعار</p>
    <label class="field">
      <span>كلمة السر</span>
      <input type="password" id="pw" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary" style="width:100%" type="submit" id="lockBtn">دخول</button>
    <p id="lockErr" style="color:var(--red);font-size:.85rem;margin-block-start:12px" hidden>كلمة السر غلط</p>
  </form>
</div>

<!-- التطبيق -->
<div id="app" hidden>
  <header class="topbar">
    <div class="wrap topbar-row">
      <h1>⚙️ لوحة التحكم</h1>
      <div class="spacer"></div>
      <a class="btn btn-ghost btn-sm" href="index.html" target="_blank" rel="noopener">عرض الموقع ↗</a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">خروج</button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button data-tab="prices" class="is-on">🧊 أسعار اليوم</button>
    <button data-tab="items">🍽️ الأصناف</button>
    <button data-tab="cats">🗂️ التصنيفات</button>
    <button data-tab="info">🏠 بيانات المطعم</button>
  </nav>

  <main class="wrap" id="view"></main>

  <div class="savebar">
    <span class="status" id="status">جاهز</span>
    <button class="btn btn-primary" id="saveBtn" type="button" disabled>حفظ التغييرات</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/dashboard.js"></script>
</body>
</html>
